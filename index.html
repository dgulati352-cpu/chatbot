<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>📝 To-Do List</h1>
        <p class="task-counter" id="task-counter">0 of 0 tasks completed</p>
      </header>

      <section class="input-section">
        <div class="input-wrapper">
          <input
            type="text"
            id="task-input"
            class="task-input"
            placeholder="Add a new task..."
            maxlength="200"
            aria-label="New task input"
          />
          <button id="add-btn" class="btn btn-primary" aria-label="Add task">
            Add
          </button>
        </div>
        <p class="error-message" id="error-message" role="alert"></p>
      </section>

      <section class="filter-section">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </section>

      <ul class="task-list" id="task-list" aria-label="Task list">
        <li class="empty-state" id="empty-state">
          No tasks yet. Add one above!
        </li>
      </ul>

      <footer class="app-footer">
        <button id="clear-completed-btn" class="btn btn-secondary">
          Clear Completed
        </button>
        <button id="clear-all-btn" class="btn btn-danger">Clear All</button>
      </footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
